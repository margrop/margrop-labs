<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1200"
  height="630"
  viewBox="0 0 1200 630"
  role="img"
  aria-labelledby="title description"
>
  <title id="title">Token Task Forge</title>
  <desc id="description">
    Idle coding tokens are forged into bounded, shippable tasks.
  </desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08111f" />
      <stop offset=".58" stop-color="#121a2d" />
      <stop offset="1" stop-color="#211628" />
    </linearGradient>
    <linearGradient id="hot-metal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#35d9ff" />
      <stop offset=".5" stop-color="#9b7cff" />
      <stop offset="1" stop-color="#ffb454" />
    </linearGradient>
    <radialGradient id="forge-glow">
      <stop offset="0" stop-color="#ff9d3f" stop-opacity=".38" />
      <stop offset="1" stop-color="#ff9d3f" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path
        d="M 48 0 L 0 0 0 48"
        fill="none"
        stroke="#9fb6d7"
        stroke-opacity=".07"
        stroke-width="1"
      />
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#background)" />
  <rect width="1200" height="630" fill="url(#grid)" />
  <circle cx="1030" cy="460" r="380" fill="url(#forge-glow)" />

  <g transform="translate(72 62)">
