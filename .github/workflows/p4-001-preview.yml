name: P4-001 Preview Bootstrap

on:
  push:
    branches:
      - main
    paths:
      - .github/deploy-requests/p4-001-preview

permissions:
  contents: read

concurrency:
  group: p4-001-preview-bootstrap
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy one-time preview
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ASTRO_TELEMETRY_DISABLED: "1"
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Run repository quality gate
        run: npm run validate

      - name: Verify preview deployment configuration
        run: npm run deploy:check:preview --workspace @margrop-labs/web

      - name: Deploy preview
        id: deploy-preview
        shell: bash
        run: |
          output="$(npm run deploy:preview --workspace @margrop-labs/web 2>&1)"
          printf '%s\n' "$output"
          deployment_url="$(printf '%s\n' "$output" | sed -nE 's#.*(https://[^[:space:]]+\.workers\.dev).*#\1#p' | tail -n 1)"
          if [[ -z "$deployment_url" ]]; then
            echo "Wrangler did not report a workers.dev deployment URL." >&2
            exit 1
          fi
          echo "deployment_url=$deployment_url" >> "$GITHUB_OUTPUT"
          echo "### Preview deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "$deployment_url" >> "$GITHUB_STEP_SUMMARY"

      - name: Smoke test preview
        run: npm run smoke --workspace @margrop-labs/web -- "${{ steps.deploy-preview.outputs.deployment_url }}"
