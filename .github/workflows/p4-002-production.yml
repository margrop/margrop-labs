name: P4-002 Production Bootstrap

on:
  push:
    branches:
      - main
    paths:
      - .github/deploy-requests/p4-002-production

permissions:
  contents: read

concurrency:
  group: p4-002-production-bootstrap
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy one-time production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ASTRO_TELEMETRY_DISABLED: "1"
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Run repository quality gate
        run: npm run validate

      - name: Verify production deployment configuration
        run: npm run deploy:check --workspace @margrop-labs/web

      - name: Deploy production
        run: npm run deploy:production --workspace @margrop-labs/web

      - name: Smoke test production
        run: npm run smoke --workspace @margrop-labs/web -- https://lab.margrop.net

      - name: Record production URL
        run: |
          echo "### Production deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "https://lab.margrop.net" >> "$GITHUB_STEP_SUMMARY"
